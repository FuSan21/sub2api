# [fork] Keeps the fusan branch on top of the latest upstream release and
# publishes ghcr.io/fusan21/sub2api. Upstream workflows are disabled in this fork.
name: fork-release

on:
  schedule:
    - cron: "0 21 * * *" # 03:00 Asia/Dhaka, before the 04:00 home-server autoupdate
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and push the image even if upstream has no new release
        type: boolean
        default: false
  push:
    branches: [fusan]

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Wei-Shaw/sub2api
  IMAGE: ghcr.io/fusan21/sub2api

jobs:
  sync:
    # Pushes made by this workflow's own merge would retrigger it; skip those.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge upstream')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      version: ${{ steps.result.outputs.version }}
      build: ${{ steps.result.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fusan
          fetch-depth: 0
          # Merging upstream can touch .github/workflows, which GITHUB_TOKEN may not push.
          token: ${{ secrets.FORK_PUSH_TOKEN || github.token }}

      - name: Merge latest upstream release
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

          tag=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
          echo "Latest upstream release: $tag"
          git fetch --no-tags upstream "refs/tags/${tag}:refs/tags/${tag}"

          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "Already contains $tag"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            if ! git merge --no-ff --no-edit -m "Merge upstream ${tag}" "$tag"; then
              {
                echo "Merging upstream \`${tag}\` into \`fusan\` conflicts in:"
                echo
                git diff --name-only --diff-filter=U | sed 's/^/- /'
                echo
                echo "Resolve locally: \`git fetch upstream --tags && git switch fusan && git merge ${tag}\`, fix, push."
              } > conflict.md
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend unit tests
        working-directory: backend
        run: go test -tags=unit ./...

      - name: Push merge
        if: steps.merge.outputs.merged == 'true'
        run: |
          git push origin HEAD:fusan
          git push origin "refs/tags/${{ steps.merge.outputs.tag }}"

      - name: Result
        id: result
        run: |
          version=$(git tag --merged HEAD --sort=-v:refname --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.merge.outputs.merged }}" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="fork-release failed"
          [ -f conflict.md ] && title="Upstream merge conflict" || echo "Sync or tests failed." > conflict.md
          echo -e "\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> conflict.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file conflict.md
          else
            gh issue create --title "$title" --body-file conflict.md
          fi

  image:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.sync.outputs.version }}+fusan
            COMMIT=${{ needs.sync.outputs.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.sync.outputs.version }}+fusan
            org.opencontainers.image.revision=${{ needs.sync.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.sync.outputs.version }}-fusan
            ${{ env.IMAGE }}:sha-${{ needs.sync.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "fork-release image build failed" \
            --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
